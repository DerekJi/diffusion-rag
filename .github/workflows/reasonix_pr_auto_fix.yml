name: Reasonix PR Auto-fix

# 触发：PR 创建或更新时自动修复格式/类型/测试问题
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto_fix:
    # 避免机器人自循环触发
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest

    steps:
      # ── 1. 检查最近提交者（防止自循环）────────────────────
      - name: Check Latest Commit Author
        id: check_author
        uses: actions/github-script@v7
        with:
          script: |
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 1
            });
            const author = commits[0]?.author?.login || '';
            const isBot = author === 'github-actions[bot]' || author === 'reasonix-dev-bot';
            core.setOutput('skip', isBot ? 'true' : 'false');
            core.setOutput('author', author);

      # ── 2. 如果最新提交是机器人则跳过 ─────────────────────
      - name: Skip if Bot Commit
        if: steps.check_author.outputs.skip == 'true'
        run: |
          echo "最新提交来自 ${{ steps.check_author.outputs.author }}，跳过自动修复。" >> $GITHUB_STEP_SUMMARY
          exit 0

      # ── 3. 检出 PR 代码 ──────────────────────────────────
      - name: Checkout Code
        if: steps.check_author.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. 设置 Python + Node ────────────────────────────
      - name: Setup Python
        if: steps.check_author.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Setup Node.js
        if: steps.check_author.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 5. 安装依赖 ──────────────────────────────────────
      - name: Install Dependencies
        if: steps.check_author.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        shell: bash

      # ── 6. 运行静态检查 ──────────────────────────────────
      - name: Run Static Checks
        id: checks
        if: steps.check_author.outputs.skip != 'true'
        continue-on-error: true
        shell: bash
        run: |
          echo "### black + isort" >> $GITHUB_STEP_SUMMARY
          black . --line-length 100 --check 2>&1 | tail -5
          isort . --check-only 2>&1 | tail -5

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### mypy" >> $GITHUB_STEP_SUMMARY
          mypy src/ --strict 2>&1 | tail -5

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### pytest" >> $GITHUB_STEP_SUMMARY
          pytest tests/ -q -m "not slow" --cov=src --cov-report=term-missing 2>&1 | tail -20

      # ── 7. 全部通过则跳过 ────────────────────────────────
      - name: Skip Fix if All Passed
        if: steps.checks.outcome == 'success'
        run: |
          echo "所有检查通过，无需修复。" >> $GITHUB_STEP_SUMMARY

      # ── 8. 自动修复失败项 ────────────────────────────────
      - name: Auto-fix with Reasonix
        if: |
          steps.check_author.outputs.skip != 'true' &&
          steps.checks.outcome == 'failure'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          echo "检查失败，运行 AI 自动修复..." >> $GITHUB_STEP_SUMMARY

          cat > fix_prompt.txt << 'FIX_EOF'
          项目静态检查或测试失败。请读取以上错误信息，逐项修复：

          1. 修复代码格式 / 类型错误 / 测试失败
          2. 运行 black . --line-length 100 && isort .
          3. 运行 pytest tests/ -q -m "not slow" 确认通过
          4. 重复直到全部绿色

          遵循 .reasonix/commands/fix-bug.md 的修复流程。
          FIX_EOF

          npx reasonix@1.2.0 run --model "deepseek-v4-flash" "$(cat fix_prompt.txt)"

      # ── 9. 提交并推送修复 ────────────────────────────────
      - name: Commit and Push Fixes
        if: |
          steps.check_author.outputs.skip != 'true' &&
          steps.checks.outcome == 'failure'
        run: |
          git config --global user.name "Reasonix-AI-Developer"
          git config --global user.email "ai-developer@github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "style: auto-fix static check issues

            🤖 Auto-fix by Reasonix + DeepSeek"
            git push origin ${{ github.head_ref }}
            echo "CHANGED=true" >> $GITHUB_ENV
            echo "修复已推送。" >> $GITHUB_STEP_SUMMARY
          else
            echo "CHANGED=false" >> $GITHUB_ENV
            echo "修复未产生代码变更。" >> $GITHUB_STEP_SUMMARY
          fi

      # ── 10. 评论 PR ─────────────────────────────────────
      - name: Post Summary to PR
        if: |
          always() &&
          steps.check_author.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.checks.outcome }}';
            const changed = process.env.CHANGED;

            let body;
            if (outcome === 'success') {
              body = '✅ **Auto-fix**: 所有静态检查通过，无需修复。';
            } else if (changed === 'true') {
              body = '🔧 **Auto-fix**: 已自动修复检查失败项并推送，请刷新查看最新 Diff。';
            } else {
              body = '⚠️ **Auto-fix**: 检查失败但自动修复未产生变更，请人工介入检查。';
            }

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

name: Reasonix PR Pipeline

# 触发：PR 创建/更新/重新审查时执行完整流水线
on:
  pull_request:
    types: [opened, synchronize]
  pull_request_review:
    types: [submitted]

concurrency:
  group: pr-pipeline-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  pipeline:
    # 避免机器人自循环：PR 创建者是 bot 直接跳过
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest

    steps:
      # ── 0. 检查最近提交者（防止自循环）────────────────────
      - name: Check Latest Commit Author
        id: check_author
        uses: actions/github-script@v7
        with:
          script: |
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 1
            });
            const author = commits[0]?.author?.login || '';
            const isBot = author === 'github-actions[bot]';
            core.setOutput('skip', isBot ? 'true' : 'false');
            core.setOutput('author', author);

      # ── 0b. 如果最新提交是机器人则跳过 ──────────────────
      - name: Skip if Bot Commit
        if: steps.check_author.outputs.skip == 'true'
        run: |
          echo "最新提交来自 bot（${{ steps.check_author.outputs.author }}），跳过。" >> $GITHUB_STEP_SUMMARY
          exit 0

      # ── 1. 检出代码 + 获取完整 Git 历史 ──────────────────
      - name: Checkout Code
        if: steps.check_author.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. 设置 Python + Node ────────────────────────────
      - name: Setup Python
        if: steps.check_author.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Setup Node.js
        if: steps.check_author.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. 缓存 HuggingFace 模型 ──────────────────────────
      - name: Cache HuggingFace Models
        if: steps.check_author.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('requirements.txt') }}
          restore-keys: hf-models-

      # ── 4. 安装依赖 ──────────────────────────────────────
      - name: Install Dependencies
        if: steps.check_author.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        shell: bash

      # ── 5. 提取 PR body 中的 model 配置 ─────────────────
      - name: Extract Model Config
        id: model_cfg
        if: steps.check_author.outputs.skip != 'true'
        shell: bash
        run: |
          BODY='${{ github.event.pull_request.body }}'
          MODEL=$(echo "$BODY" | grep -im1 '^model:' | sed 's/.*:[[:space:]]*//' | tr '[:upper:]' '[:lower:]' | xargs || echo "")
          if [ -z "$MODEL" ]; then
            MODEL="deepseek-flash"
            echo "⚠️ 未指定 model，使用默认值 deepseek-flash" >> $GITHUB_STEP_SUMMARY
          fi
          case "$MODEL" in
            pro|deepseek-pro)
              MODEL="deepseek-pro";;
            flash|deepseek-flash|*)
              MODEL="deepseek-flash";;
          esac
          echo "model=$MODEL" >> $GITHUB_OUTPUT
          echo "使用模型: $MODEL"

      # ══════════════════════════════════════════════════════
      # Phase 1: 静态检查（格式/类型/测试）
      # ══════════════════════════════════════════════════════

      # ── 6. 运行格式检查 ────────────────────────────────
      - name: Formatting Check
        id: format
        if: steps.check_author.outputs.skip != 'true'
        continue-on-error: true
        shell: bash
        run: |
          echo "### black + isort" >> $GITHUB_STEP_SUMMARY
          black . --line-length 100 --check 2>&1 | tail -5
          isort . --check-only 2>&1 | tail -5

      # ── 7. 运行类型检查 ────────────────────────────────
      - name: Type Check
        id: typecheck
        if: steps.check_author.outputs.skip != 'true'
        continue-on-error: true
        shell: bash
        run: |
          echo "### mypy" >> $GITHUB_STEP_SUMMARY
          mypy src/ --strict 2>&1 | tail -5

      # ── 8. 运行测试 ────────────────────────────────────
      - name: Run Tests
        id: test
        if: steps.check_author.outputs.skip != 'true'
        continue-on-error: true
        shell: bash
        run: |
          echo "### pytest" >> $GITHUB_STEP_SUMMARY
          pytest tests/ -q -m "not slow" --cov=src --cov-report=term-missing 2>&1 | tail -20

      # ── 9. 评论静态检查结果到 PR ─────────────────────────
      - name: Post Check Results
        if: steps.check_author.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fmt = '${{ steps.format.outcome }}';
            const typ = '${{ steps.typecheck.outcome }}';
            const tst = '${{ steps.test.outcome }}';
            const emoji = (s) => s === 'success' ? '✅' : '❌';
            const label = (s) => s === 'success' ? '通过' : '失败';
            const passCount = (fmt === 'success' ? 1 : 0) + (typ === 'success' ? 1 : 0) + (tst === 'success' ? 1 : 0);

            const body = `## 🔍 静态检查结果\n\n| 检查项 | 状态 |\n|--------|------|\n| ${emoji(fmt)} black + isort | ${label(fmt)} |\n| ${emoji(typ)} mypy (strict) | ${label(typ)} |\n| ${emoji(tst)} pytest --cov | ${label(tst)} |\n\n**${passCount}/3 项通过**\n`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      # ── 10. 自动修复静态检查失败项（如需要）──────────────
      - name: Auto-fix Static Issues
        if: |
          steps.check_author.outputs.skip != 'true' &&
          (steps.format.outcome == 'failure' || steps.typecheck.outcome == 'failure' || steps.test.outcome == 'failure')
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          echo "检查失败，运行 AI 自动修复..." >> $GITHUB_STEP_SUMMARY

          cat > fix_static.txt << 'FIX_EOF'
          项目静态检查或测试失败。请读取以上错误信息，逐项修复：

          1. 修复代码格式 / 类型错误 / 测试失败
          2. 运行 black . --line-length 100 && isort .
          3. 运行 pytest tests/ -q -m "not slow" 确认通过
          4. 重复直到全部绿色

          遵循 .reasonix/commands/fix-bug.md 的修复流程。
          FIX_EOF

          npx reasonix@1.2.0 run --model "${{ steps.model_cfg.outputs.model }}" "$(cat fix_static.txt)"

      # ══════════════════════════════════════════════════════
      # Phase 2: Code Review（基于静态修复后的代码）
      # ══════════════════════════════════════════════════════

      # ── 11. 生成最终 PR Diff（包含 Phase 1 的改动）───────
      - name: Generate PR Diff for Review
        if: steps.check_author.outputs.skip != 'true'
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_changes.diff
          echo "Diff size: $(wc -l < pr_changes.diff) lines"

      # ── 12. 运行代码审查 ───────────────────────────────
      - name: Run Code Review
        id: review
        if: steps.check_author.outputs.skip != 'true'
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          mkdir -p .temp
          cat > review_prompt.txt << 'PROMPT_END'
          # PR 代码审查

          请严格按以下项目级审查标准 review 下方 diff。

          ## 审查标准
          PROMPT_END
          cat .reasonix/commands/code-review.md >> review_prompt.txt
          printf '\n\n## 代码变更 Diff\n\n' >> review_prompt.txt
          cat pr_changes.diff >> review_prompt.txt

          npx reasonix@1.2.0 run \
            --model deepseek-pro \
            "$(cat review_prompt.txt)" > .temp/review-report.md

      # ── 13. 发布审查报告到 PR ──────────────────────────
      - name: Post Review Comment
        if: steps.check_author.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try {
              report = fs.readFileSync('.temp/review-report.md', 'utf8');
            } catch (e) {
              report = '';
            }
            const body = report.length > 0
              ? report
              : "🤖 **Reasonix** 审查完毕，未发现需要报告的问题。";

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      # ── 14. 根据审查结果自动修复（如需要）──────────────
      - name: Auto-fix Review Issues
        if: steps.check_author.outputs.skip != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ ! -f .temp/review-report.md ] || [ ! -s .temp/review-report.md ]; then
            echo "无审查报告，跳过修复。" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "审查发现问题，运行 AI 修复..." >> $GITHUB_STEP_SUMMARY

          cat > fix_review.txt << 'PROMPT_END'
          # 根据审查结果自动修复

          下面是代码审查报告和 PR 代码变更。请：
          1. 读取审查报告中的每个问题
          2. 按 fix-bug.md 流程修复代码
          3. 修复后运行 black . --line-length 100 && isort .
          4. 运行 pytest tests/ -q -m "not slow"
          5. 如果测试失败，读取报错信息继续修复
          6. 重复直到全部绿色
          7. 最终输出改了什么文件

          ## 修复规范
          PROMPT_END
          cat .reasonix/commands/fix-bug.md >> fix_review.txt
          printf '\n\n## 审查报告\n\n' >> fix_review.txt
          cat .temp/review-report.md >> fix_review.txt
          printf '\n\n## 代码变更 Diff\n\n' >> fix_review.txt
          cat pr_changes.diff >> fix_review.txt

          npx reasonix@1.2.0 run \
            --model deepseek-pro \
            "$(cat fix_review.txt)"

      # ══════════════════════════════════════════════════════
      # Phase 3: 最终验证 + 推送
      # ══════════════════════════════════════════════════════

      # ── 15. 最终验证 ───────────────────────────────────
      - name: Final Verification
        id: verify
        if: steps.check_author.outputs.skip != 'true'
        continue-on-error: true
        run: |
          black . --line-length 100 --check
          isort . --check-only
          pytest tests/ -q -m "not slow" --cov=src --cov-report=term-missing | tail -15

      # ── 16. 第二轮修复（验证失败时） ────────────────────
      - name: Round 2 Fix if Needed
        if: steps.check_author.outputs.skip != 'true' && steps.verify.outcome == 'failure'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "验证失败，运行第二轮修复..." >> $GITHUB_STEP_SUMMARY
          cat > repair2.txt << 'PROMPT_END'
          修复仍未通过全部检查。请：
          1. 运行 black . --line-length 100 && isort .
          2. 运行 pytest tests/ -q -m "not slow"
          3. 修复所有失败项
          4. 重复直到全部绿色
          PROMPT_END
          npx reasonix@1.2.0 run \
            --model deepseek-pro \
            "$(cat repair2.txt)"

          # 再验证一次
          black . --line-length 100 --check
          isort . --check-only
          pytest tests/ -q -m "not slow"

      # ── 17. 一次性提交并推送所有修复 ──────────────────
      - name: Commit and Push All Fixes
        if: steps.check_author.outputs.skip != 'true'
        run: |
          git config --global user.name "Reasonix-AI-Developer"
          git config --global user.email "ai-developer@github.com"

          if [ -n "$(git status --porcelain)" ]; then
            # 移除 CI 临时产物(大 diff/prompt 文件), 防止超 GitHub 100MB 限制
            rm -f pr_changes.diff review_prompt.txt fix_review.txt fix_static.txt repair.txt repair2.txt
            rm -rf .temp
            git add .
            git commit -m "fix: auto-fix pipeline

            🤖 Auto-fix by Reasonix"
            git push origin ${{ github.head_ref }}
            echo "FIXES_PUSHED=true" >> $GITHUB_ENV
            echo "修复已推送。" >> $GITHUB_STEP_SUMMARY
          else
            echo "FIXES_PUSHED=false" >> $GITHUB_ENV
            echo "未产生代码变更。" >> $GITHUB_STEP_SUMMARY
          fi

      # ── 18. 发布修复摘要到 PR ──────────────────────────
      - name: Post Pipeline Summary
        if: steps.check_author.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pushed = process.env.FIXES_PUSHED === 'true';
            const body = pushed
              ? "🔧 **Pipeline**: 已自动修复问题并推送，请刷新查看最新 Diff。"
              : "✅ **Pipeline**: 全部检查通过，无需修复。";

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

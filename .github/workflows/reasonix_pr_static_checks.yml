name: Reasonix PR Static Checks

# 触发：PR 创建或更新时运行代码静态检查
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  static_checks:
    # 避免机器人 PR 重复触发
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest

    steps:
      # ── 1. 检出代码 ──────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. 设置 Python ───────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # ── 3. 安装依赖 ──────────────────────────────────────
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        shell: bash

      # ── 4. 运行格式检查 ──────────────────────────────────
      - name: Check Formatting (black + isort)
        id: format
        continue-on-error: true
        run: |
          echo "### black" >> $GITHUB_STEP_SUMMARY
          black . --line-length 100 --check 2>&1 | tail -5
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### isort" >> $GITHUB_STEP_SUMMARY
          isort . --check-only 2>&1 | tail -5

      # ── 5. 运行类型检查 ──────────────────────────────────
      - name: Type Check (mypy)
        id: typecheck
        continue-on-error: true
        run: |
          echo "### mypy" >> $GITHUB_STEP_SUMMARY
          mypy src/ --strict 2>&1 | tail -10

      # ── 6. 运行测试 ──────────────────────────────────────
      - name: Run Tests (pytest)
        id: test
        continue-on-error: true
        run: |
          echo "### pytest" >> $GITHUB_STEP_SUMMARY
          pytest tests/ -q -m "not slow" --cov=src --cov-report=term-missing 2>&1 | tail -20

      # ── 7. 汇总结果并评论 PR ─────────────────────────────
      - name: Post Result to PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const format = '${{ steps.format.outcome }}';
            const typecheck = '${{ steps.typecheck.outcome }}';
            const test = '${{ steps.test.outcome }}';

            const emoji = (s) => s === 'success' ? '✅' : '❌';
            const label = (s) => s === 'success' ? '通过' : '失败';

            let body = `## 🔍 静态检查结果\n\n`;
            body += `| 检查项 | 状态 |\n`;
            body += `|--------|------|\n`;
            body += `| ${emoji(format)} black + isort | ${label(format)} |\n`;
            body += `| ${emoji(typecheck)} mypy (strict) | ${label(typecheck)} |\n`;
            body += `| ${emoji(test)} pytest --cov | ${label(test)} |\n`;

            // 性能计数（可选）
            const counts = [format, typecheck, test];
            const passCount = counts.filter(s => s === 'success').length;
            body += `\n**${passCount}/3 项通过**\n`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
